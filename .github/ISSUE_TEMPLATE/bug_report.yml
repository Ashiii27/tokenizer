name: Bug report
description: Something is wrong, broken, or misleading.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the page shows the wrong *explanation* (not just a crash), that is a bug too — please say
        which claim you think is wrong.
  - type: input
    id: url
    attributes:
      label: Page / link
      description: The live URL, or a shareable link with your inputs in the query string.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open section 3
        2. Enter "नमस्ते 🌏"
        3. …
  - type: input
    id: browser
    attributes:
      label: Browser, version and device
      placeholder: Chrome 129 on Android 14 / Safari 18 on macOS 15
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors from the browser console, if any.
      render: shell
